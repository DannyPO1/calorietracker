name: Install CalorieTracker ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find CalorieTracker release ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=(CalorieTracker-iPhone-v*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Geen CalorieTracker release ZIP gevonden."
            exit 0
          fi

          if [ ${#zips[@]} -gt 1 ]; then
            echo "Meerdere CalorieTracker ZIP-bestanden gevonden:"
            printf '%s\n' "${zips[@]}"
            echo "Upload slechts één release-ZIP tegelijk."
            exit 1
          fi

          ZIP_FILE="${zips[0]}"

          VERSION=$(echo "$ZIP_FILE" | sed -E 's/^CalorieTracker-iPhone-v([0-9]+\.[0-9]+\.[0-9]+)\.zip$/\1/')

          if [ -z "$VERSION" ] || [ "$VERSION" = "$ZIP_FILE" ]; then
            echo "Kan versienummer niet uitlezen uit: $ZIP_FILE"
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release gevonden:"
          echo "Bestand: $ZIP_FILE"
          echo "Versie: $VERSION"

      - name: Install release ZIP
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.zip.outputs.file }}"
          TEMP_DIR="$(mktemp -d)"

          echo "ZIP uitpakken..."
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          shopt -s dotglob nullglob

          entries=("$TEMP_DIR"/*)

          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            SOURCE_DIR="${entries[0]}"
          else
            SOURCE_DIR="$TEMP_DIR"
          fi

          echo "Bronmap: $SOURCE_DIR"

          # .github en .git nooit vanuit een release-ZIP overschrijven
          rm -rf "$SOURCE_DIR/.github" 2>/dev/null || true
          rm -rf "$SOURCE_DIR/.git" 2>/dev/null || true

          # Bestanden kopiëren naar de repository.
          # Bestaande bestanden worden vervangen.
          # Bestanden die niet in de ZIP zitten blijven behouden.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_DIR/" ./

          rm -f "$ZIP_FILE"
          rm -rf "$TEMP_DIR"

          echo "Release geïnstalleerd."

      - name: Commit release
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.zip.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Geen wijzigingen gevonden."
            exit 0
          fi

          git commit -m "Release CalorieTracker v${VERSION}"
          git push

      - name: Create version tag
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.zip.outputs.version }}"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG bestaat lokaal al."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG bestaat al op GitHub."
            exit 0
          fi

          git tag -a "$TAG" -m "CalorieTracker v${VERSION}"
          git push origin "$TAG"

          echo "Tag $TAG aangemaakt."